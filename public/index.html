<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saldo Inteligente</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">💳</div>
          <div>
            <h1>Saldo Inteligente</h1>
            <p>Finanças Pessoais Inteligentes</p>
          </div>
        </div>

        <nav id="menu"></nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <input placeholder="Pesquisar..." />
          <div class="topbar-actions">
            <span>◐</span><span>🔔</span><span class="avatar">A</span>
          </div>
        </header>

        <section id="page"></section>
      </main>
    </div>

    <div class="modal-overlay hidden" id="expense-modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3>Nova Despesa</h3>
          <button id="close-expense-modal" type="button">✕</button>
        </div>
        <form id="expense-form">
          <label>Descrição *</label>
          <input name="descricao" required placeholder="Ex: Supermercado" />

          <div class="grid-2">
            <div>
              <label>Valor (R$) *</label>
              <input type="number" step="0.01" name="valor" required placeholder="0,00" />
            </div>
            <div>
              <label>Data *</label>
              <input type="date" name="data" required />
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label>Categoria</label>
              <select name="categoria">
                <option>Alimentação</option>
                <option>Moradia</option>
                <option>Assinaturas</option>
                <option>Saúde</option>
                <option>Transporte</option>
                <option>Outros</option>
              </select>
            </div>
            <div>
              <label>Pagamento</label>
              <select name="pagamento">
                <option>Pix</option>
                <option>Cartão de Crédito</option>
                <option>Boleto</option>
                <option>Dinheiro</option>
              </select>
            </div>
          </div>

          <label>Recorrência</label>
          <select name="recorrencia">
            <option>Uma vez</option>
            <option>Mensal</option>
            <option>Semanal</option>
            <option>Anual</option>
          </select>

          <label>Observações</label>
          <textarea name="observacoes" placeholder="Opcional"></textarea>

          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancel-expense-modal">Cancelar</button>
            <button type="submit" class="btn-danger">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
